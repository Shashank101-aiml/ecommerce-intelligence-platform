x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/project
    DATABASE_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/ecommerce
    UCI_ONLINE_RETAIL_URL: "https://archive.ics.uci.edu/ml/machine-learning-databases/00352/Online%20Retail.xlsx"
    # Dev-only convenience: installs the project's non-Airflow deps into the
    # official image at container start. Fine for a coursework project;
    # a pinned custom image would replace this in a production setup.
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.2.2 openpyxl==3.1.5 requests==2.32.3"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/project/src
    - ./data:/opt/airflow/project/data
    - ./logs:/opt/airflow/project/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      # Host-side 5433 avoids clashing with a locally installed Postgres
      # service on the default 5432. Internal container-to-container
      # traffic (Airflow -> postgres) still uses port 5432 unaffected.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init/01-init-ecommerce-db.sh:/docker-entrypoint-initdb.d/01-init-ecommerce-db.sh:ro
      - ./src/db/schema:/docker-entrypoint-initdb.d/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
